<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ur_Daemon - Network Disruption System</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Orbitron:wght@700;900&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blood-red: #ff0000;
            --kali-blue: #0087ff;
            --dark-void: #020204;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Orbitron', 'Cairo', sans-serif;
            background: radial-gradient(circle at center, #1a0000 0%, var(--dark-void) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .container {
            text-align: center;
            padding: 40px 30px;
            max-width: 550px;
            width: 90%;
            background: rgba(5, 5, 8, 0.95);
            border: 1px solid var(--blood-red);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
            z-index: 2;
        }

        .logo {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            color: #fff;
            text-shadow: 3px 3px 0px var(--blood-red);
            letter-spacing: 2px;
        }

        .subtitle {
            color: var(--kali-blue);
            font-size: 0.7rem;
            letter-spacing: 1px;
            margin-bottom: 30px;
        }

        /* زر التحميل الرئيسي */
        .flash-btn {
            background: var(--blood-red);
            border: none;
            padding: 16px 25px;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 1.2rem;
            cursor: pointer;
            margin: 25px 0;
            border-radius: 50px;
            width: 100%;
            transition: 0.2s;
            box-shadow: 0 0 15px rgba(255,0,0,0.3);
        }

        .flash-btn:hover {
            background: #cc0000;
            transform: scale(1.02);
            box-shadow: 0 0 25px rgba(255,0,0,0.6);
        }

        /* نافذة رفع الكود المنبثقة */
        .flash-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #0a0a0f;
            border: 2px solid var(--blood-red);
            border-radius: 20px;
            padding: 30px;
            z-index: 20000;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 70px rgba(255,0,0,0.6);
            display: none;
        }

        .flash-popup.active {
            display: block;
            animation: fadeScale 0.2s ease;
        }

        @keyframes fadeScale {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.9);}
            to { opacity: 1; transform: translate(-50%, -50%) scale(1);}
        }

        .flash-popup h3 {
            color: var(--blood-red);
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .flash-popup p {
            color: #ccc;
            margin-bottom: 25px;
        }

        .close-popup {
            background: #333;
            border: none;
            padding: 10px 25px;
            color: #fff;
            border-radius: 40px;
            margin-top: 15px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .close-popup:hover {
            background: #555;
        }

        /* توافق مع esp-web-tools */
        esp-web-install-button {
            margin: 10px auto;
            display: block;
            --esp-tools-install-button-bg-color: #00ffcc;
            --esp-tools-install-button-text-color: #000;
            --esp-tools-install-button-border-radius: 50px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.6rem;
            color: #666;
        }
    </style>
    <script type="module" src="https://unpkg.com/esp-web-tools@3.4.2/dist/web/install-button.js?module"></script>
</head>
<body>

<div class="container">
    <div class="logo">⚡</div>
    <h1>UR_DAEMON</h1>
    <div class="subtitle">// NETWORK DISRUPTION //</div>

    <!-- زر التحميل الوحيد -->
    <button class="flash-btn" id="mainFlashBtn">🔥 تحميل ورفع الكود 🔥</button>

    <footer>UR_DAEMON © 2026 | BLACKHAT INTERFACE</footer>
</div>

<!-- نافذة رفع الكود -->
<div id="flashPopup" class="flash-popup">
    <h3>⚠️ رفع الكود على ESP32</h3>
    <p>سيتم رفع كود إنشاء الشبكات الوهمية</p>
    <esp-web-install-button
        manifest="./firmware/beacon-spam/manifest.json"
        baud-rate="115200">
    </esp-web-install-button>
    <button class="close-popup" onclick="closeFlashPopup()">إلغاء</button>
</div>

<script>
    const mainBtn = document.getElementById('mainFlashBtn');
    const popup = document.getElementById('flashPopup');

    mainBtn.addEventListener('click', () => {
        popup.classList.add('active');
    });

    function closeFlashPopup() {
        popup.classList.remove('active');
    }

    // إغلاق النافذة إذا ضغط المستخدم خارجها
    window.onclick = function(e) {
        if (e.target === popup) closeFlashPopup();
    }
</script>

</body>
</html>
